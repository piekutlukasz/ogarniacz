# nginx przed aplikacją bez Dockera, np. /etc/nginx/sites-available/ogarniacz. DOMENA zamień na swoją domenę.
# Certyfikat np. z Let's Encrypt (certbot --nginx dopisze ssl_certificate i przekierowanie z http).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMENA;
    # ssl_certificate i ssl_certificate_key według Twojej konfiguracji certyfikatu

    # HSTS ustawia ten, kto kończy TLS; aplikacja go nie wysyła.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Nadpisane, żeby wartość od klienta nie docierała do API (ochrona przed CSRF porównuje go z Origin).
        proxy_set_header X-Forwarded-Host $host;
        # Adres klienta dla limitu prób logowania. Gdy przed nginx stoi proxy dostawcy, które samo nadpisuje
        # X-Real-IP, użyj $http_x_real_ip i sprawdź blokadę testem z docs/instrukcje/WDROZENIE.md.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMENA;
    return 301 https://$host$request_uri;
}
