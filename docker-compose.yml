# Wariant dla serwera, który ma już własne proxy z HTTPS (np. nginx): aplikacja na 127.0.0.1:3000.
# Gotowy zestaw z HTTPS (Caddy) jest w deploy/docker, opis w docs/instrukcje/WDROZENIE.md.
services:
  ogarniacz:
    # Gotowy obraz z GHCR: tag 1 to ostatnie wydanie 1.x (`docker compose pull && docker compose up -d`).
    # `docker compose up -d --build` buduje obraz z tego repozytorium pod tą samą nazwą.
    image: ghcr.io/piekutlukasz/ogarniacz:1
    build: .
    restart: unless-stopped
    # Ustawienia (kalendarze, powiadomienia): skopiuj deploy/docker/.env.example do .env obok tego pliku.
    # Bez pliku aplikacja startuje z wartościami domyślnymi.
    env_file:
      - path: .env
        required: false
    # Port tylko lokalnie: ruch z internetu przechodzi przez proxy z HTTPS.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ogarniacz-data:/data

volumes:
  ogarniacz-data:
